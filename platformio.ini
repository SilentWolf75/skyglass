; SkyGlass — Waveshare ESP32-S3-Touch-AMOLED-1.75
;
; Two environments:
;   esp32-s3-amoled-175  -> real firmware (Arduino_GFX + LVGL), flashed to the board
;   native               -> desktop LVGL simulator (SDL2), runs the same UI on the Mac
;
; Build/run the simulator:   pio run -e native -t exec
; Build/flash the device:    pio run -e esp32-s3-amoled-175 -t upload

[env:esp32-s3-amoled-175]
; pioarduino fork of the espressif32 platform (Arduino core 3.x / ESP-IDF 5.x).
; This exact release is what the reference board builds use and is already installed
; locally; swap to "espressif32" (registry) if you prefer the official platform.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-s3-devkitc-1      ; generic S3; matches ESP32-S3R8 (8MB PSRAM / 16MB flash)
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; sim_main.cpp is desktop-only (has its own main() + SDL); keep it out of the firmware
build_src_filter = +<*> -<sim_main.cpp> -<fonts/> +<fonts/montserrat_64_digits.c>

; ESP32-S3R8: QIO flash + OPI PSRAM, 16 MB flash + matching partition table
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0              ; silence Arduino library [E] spam (Wire I2C -1/263, ssl_client);
                                      ;   our own Serial.printf [adsb]/[gps]/[wifi] logs are unaffected
    ; 2*(512*4+1) + 32 -- the obvious (512*4+1)*2 is 30 bytes short, and the overflow
    ; lands in PNGdec's own file-read buffer and corrupts its chunk walk mid-decode.
    -DPNG_MAX_BUFFERED_PIXELS=4224
    -DLV_CONF_INCLUDE_SIMPLE          ; LVGL does #include "lv_conf.h"
    -I"${PROJECT_DIR}/include"        ; ...and finds it here (PIO's auto include/ is not on the LIBRARY path)
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    moononournation/GFX Library for Arduino @ 1.6.4   ; has Arduino_CO5300 + Arduino_ESP32QSPI
    lvgl/lvgl @ 8.4.0                                  ; lv_conf.h in include/ targets v8
    bblanchon/ArduinoJson @ ^7.0.4
    https://github.com/tzapu/WiFiManager.git
    lewisxhe/XPowersLib                               ; AXP2101 battery gauge
    bodmer/TJpg_Decoder                               ; JPEG decode for aircraft photos
    mikalhart/TinyGPSPlus                             ; NMEA parsing for the LC76G GPS (-G variant)
    bitbank2/PNGdec                                   ; decode RainViewer radar tiles + basemap tiles
    links2004/WebSockets @ ^2.4.1                     ; aisstream.io live AIS feed (WSS)
; Notes:
; - lv_conf.h lives in include/ (added to the include path above).
; - Versions are pinned to a known-good combination for this panel; bump deliberately.

; --- OTA upload (flash over WiFi) -------------------------------------------
; Device must be powered and on WiFi. Then:  pio run -e esp32-s3-amoled-175-ota -t upload
; Each board answers to its own mDNS name; plain skyglass.local no longer resolves.
[env:esp32-s3-amoled-175-ota]
extends = env:esp32-s3-amoled-175
upload_protocol = espota
upload_port = skyglass-s3.local

; --- Desktop LVGL simulator (SDL2) -------------------------------------------
[env:native]
platform = native
; Only the portable UI + the SDL sim main; no Arduino_GFX / WiFi / device code.
build_src_filter = -<*> +<radar_view.cpp> +<ui.cpp> +<route.cpp> +<photo.cpp> +<airline.cpp> +<weather.cpp> +<wx_radar.cpp> +<cloud_image.cpp> +<coastline.cpp> +<airports.cpp> +<runways.cpp> +<map_bg.cpp> +<vessel.cpp> +<aircraft_types.cpp> +<weather_icons.cpp> +<sd_store.cpp> +<units.cpp> +<fonts/montserrat_64_digits.c> +<sim_main.cpp>
build_flags =
    !sdl2-config --cflags --libs      ; SDL2 include/lib flags (Homebrew sdl2)
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -DLV_LOG_PRINTF=1
    -std=gnu++17
lib_deps =
    lvgl/lvgl @ 8.4.0

; ---------------------------------------------------------------------------------
; Waveshare ESP32-P4-WIFI6-Touch-LCD-4C - 4" round IPS 720x720, MIPI-DSI.
; Running on hardware (docs/PORT_P4.md): the panel goes through esp_lcd_mipi_dsi, touch
; through the Goodix driver, and Wi-Fi through the onboard C6 over esp_hosted. Shares
; every UI and data source file with the S3 build.
[env:esp32-p4-lcd-4c]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
; Custom board definition (boards/). The generic esp32-p4 target assumes 4 MB flash and
; leaves PSRAM at defaults; this board has 32 MB of each and needs f_psram at 200 MHz --
; the DPI panel scans a 720x720x16bpp framebuffer out of PSRAM continuously (~135 MB/s),
; which a slow PSRAM clock cannot sustain.
board = waveshare_esp32p4_wifi6_4c
framework = arduino
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_WAVESHARE_P4_LCD_4C
    -DCORE_DEBUG_LEVEL=0              ; silence Arduino library [E] spam
    -DPNG_MAX_BUFFERED_PIXELS=4224    ; see the S3 env: without it no radar tile decodes
    -DLV_CONF_INCLUDE_SIMPLE
    -I"${PROJECT_DIR}/include"
    -std=gnu++17
build_src_filter =
    -<*>
    +<main.cpp> +<display_p4.cpp> +<touch_gt911.cpp> +<p4_shims.cpp> +<ui.cpp> +<radar_view.cpp> +<aircraft_types.cpp> +<route.cpp>
    +<photo.cpp> +<airline.cpp> +<weather.cpp> +<wx_radar.cpp> +<cloud_image.cpp>
    +<coastline.cpp> +<airports.cpp> +<runways.cpp> +<map_bg.cpp>
    +<vessel.cpp> +<weather_icons.cpp> +<ais_client.cpp>
    +<adsb_client.cpp> +<updater.cpp> +<photo_client.cpp> +<route_client.cpp>
    +<airline_client.cpp> +<weather_client.cpp> +<wx_radar_client.cpp>
    +<cloud_image_client.cpp>
    +<map_client.cpp> +<audio.cpp> +<gps.cpp>
    +<net_fetch.cpp> +<wav_upload.cpp> +<geo.cpp> +<sd_store.cpp> +<units.cpp>
    +<fonts/montserrat_96_digits.c>
; Same set as the S3 env minus: Arduino_GFX (DSI here, driven by esp_lcd), XPowersLib
; (no AXP2101 on the 4C) and WiFiManager (needs a native PHY the P4 does not have).
lib_deps =
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^7.0.4
    bodmer/TJpg_Decoder
    mikalhart/TinyGPSPlus
    bitbank2/PNGdec
    links2004/WebSockets @ ^2.4.1

[env:esp32-p4-lcd-4c-ota]
extends = env:esp32-p4-lcd-4c
upload_protocol = espota
upload_port = skyglass-p4.local
